function applyCustomerToCustStorage(c){

  LS.set('oc_cust',{
    n:fullName||LS.get('oc_cust',{}).n||'',

}

async function refreshSession(){
  try{
    const r=await fetch('/api/auth/me',{credentials:'same-origin'});
    if(!r.ok)return;
    const j=await r.json();
    if(j&&j.ok){
      cust=j.customer||null;
      custOrders=Array.isArray(j.orders)?j.orders:[];
      if(cust)applyCustomerToCustStorage(cust);
      updAccountBtn();
    }
  }catch{}
}

/* Créneaux d'enlèvement ou de livraison du jour (toutes les 15 min, à partir de maintenant + délai de préparation) */
/* Créneaux d'enlèvement ou de livraison : affiche les plages du jour (ou prochaines plages pour tester) */
function slotsOf(){
  const H=(M.shop.hours||{}),out=[['Dès que possible','Dès que possible']];
  const isDeliv=mode==='LIVRAISON';
  const rawRanges=isDeliv
    ?(H.deliveryToday||H.orderToday||H.pickupToday||[])
    :(H.pickupToday||H.orderToday||[]);
  const ranges=rawRanges.length?rawRanges:[['11:30','14:30'],['18:00','22:30']];

  const prep=isDeliv?(H.deliveryPrepMin??H.prepDelivery??45):(H.prepMin??H.prepPickup??30);
  const mm=s=>+s.slice(0,2)*60+ +s.slice(3);
  const hm=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');

  const nowHm=H.nowHm||'11:00';
  const nowMin=mm(nowHm)+Math.floor((Date.now()-(M._t0||Date.now()))/60000)+prep;
  const maxClose=Math.max(...ranges.map(([,b])=>mm(b)));
  const startFloor=nowMin>maxClose?0:nowMin;

  const seen=new Set(['Dès que possible']);
  for(const [a,b] of ranges){
    for(let t=Math.max(mm(a),Math.ceil(startFloor/15)*15);t<=mm(b);t+=15){
      const label=hm(t);
      if(!seen.has(label)){seen.add(label);out.push([label,label])}
    }
  }
  return out;
}

          msg.textContent='';sub.disabled=true;
          try{
            const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em.value.trim(),password:pw.value})});
            const j=await r.json();
            if(!r.ok||!j.ok)throw new Error(j.error||'Connexion impossible');
            await refreshSession();d.close();
          }catch(e){msg.textContent=e.message;sub.disabled=false}
        };
        box.append(sub,msg);
      }else{
        const em=mk('Adresse e-mail *','client@exemple.fr','email');
        const pw=mk('Mot de passe (8 caractères min.) *','••••••••','password');
        const fn=mk('Prénom *','Karim','text');
        const ln=mk('Nom','Benali','text');
        const ph=mk('Téléphone *','06 12 34 56 78','tel');
        const ad=mk('Adresse de livraison','12 rue de la Gare','text');
        const cp=mk('Code postal','77390','text','77390');
        const ci=mk('Ville','Chaumes-en-Brie','text','Chaumes-en-Brie');
        const rgpd=el('label',{style:'display:flex;gap:8px;align-items:flex-start;font-size:12px;margin-top:10px;color:#555'});
        const chk=el('input',{type:'checkbox'});
        rgpd.append(chk,el('span',0,"J'accepte l'enregistrement de mes coordonnées dans mon compte Ô Cezam 77 pour faciliter mes commandes (consultable et supprimable à tout moment)."));
        box.appendChild(rgpd);

        const sub=el('button',{type:'button',className:'btn g',style:'margin-top:12px'},'Créer mon compte');
        sub.onclick=async()=>{
          msg.textContent='';
          if(!chk.checked){msg.textContent='Veuillez accepter la conservation de vos données pour créer le compte.';return}
          sub.disabled=true;
          try{
            const r=await fetch('/api/auth/register',{
              method:'POST',
              headers:{'Content-Type':'application/json'},
              body:JSON.stringify({
                email:em.value.trim(),
                password:pw.value,
                first_name:fn.value.trim(),
                last_name:ln.value.trim(),
                phone:ph.value.trim(),
                address:ad.value.trim(),
                postal_code:cp.value.trim(),
                city:ci.value.trim()
              })
            });
            const j=await r.json();
            if(!r.ok||!j.ok)throw new Error(j.error||'Inscription impossible');
            await refreshSession();d.close();
          }catch(e){msg.textContent=e.message;sub.disabled=false}
        };
        box.append(sub,msg);
      }
    };

    bLogin.onclick=()=>{tab='login';bLogin.className='on';bReg.className='';renderForm()};
    bReg.onclick=()=>{tab='register';bReg.className='on';bLogin.className='';renderForm()};
    sg.append(bLogin,bReg);
    d.append(sg,box);
    renderForm();
  }else{
    d.appendChild(el('p',{style:'margin:6px 0'},'Compte : '+el('b',0,cust.email).textContent));
    const mk=(lbl,val)=>{
      d.appendChild(el('label',{className:'f'},lbl));
      const i=el('input',{className:'t',value:val||''});
      d.appendChild(i);return i;
    };
    const fn=mk('Prénom',cust.first_name);
    const ln=mk('Nom',cust.last_name);
    const ph=mk('Téléphone',cust.phone);
    const ad=mk('Adresse de livraison',cust.address);
    const cp=mk('Code postal',cust.postal_code);
    const ci=mk('Ville',cust.city);
    const fb=el('p',{className:'okm'});

    const saveBtn=el('button',{type:'button',className:'btn g',style:'margin-top:10px'},'Enregistrer mes infos');
    saveBtn.onclick=async()=>{
      fb.className='okm';fb.textContent='';saveBtn.disabled=true;
      try{
        const r=await fetch('/api/auth/me',{
          method:'PUT',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            first_name:fn.value.trim(),
            last_name:ln.value.trim(),
            phone:ph.value.trim(),
            address:ad.value.trim(),
            postal_code:cp.value.trim(),
            city:ci.value.trim()
          })
        });
        const j=await r.json();
        if(!r.ok||!j.ok)throw new Error(j.error||'Mise à jour impossible');
        cust=j.customer;applyCustomerToCustStorage(cust);updAccountBtn();
        fb.textContent='Coordonnées mises à jour.';
      }catch(e){fb.className='err';fb.textContent=e.message}
      saveBtn.disabled=false;
    };

    const outBtn=el('button',{type:'button',className:'btn s',style:'margin-top:10px;margin-left:8px'},'Déconnexion');
    outBtn.onclick=async()=>{
      await fetch('/api/auth/logout',{method:'POST'}).catch(()=>{});
      cust=null;custOrders=[];updAccountBtn();openAccount();
    };

    const delBtn=el('button',{type:'button',className:'btn d',style:'margin-top:10px;margin-left:8px'},'Supprimer mon compte');
    delBtn.onclick=async()=>{
      if(!confirm('Supprimer définitivement votre compte Ô Cezam 77 et vos données enregistrées ?'))return;
      const r=await fetch('/api/auth/me',{method:'DELETE'}).catch(()=>null);
      if(r&&r.ok){cust=null;custOrders=[];updAccountBtn();openAccount()}
    };

    d.append(saveBtn,outBtn,delBtn,fb);

    if(custOrders.length){
      d.appendChild(el('h4',{style:'margin:18px 0 6px'},'Mes commandes récentes'));
      custOrders.slice(0,5).forEach(o=>{
        const row=el('div',{className:'row'});
        row.append(
          el('span',0,'#'+(o.num||o.id)+' · '+(o.slot_time||'À l\'heure')+' ('+o.status+')'),
          el('b',0,eur(o.total||0))
        );
        d.appendChild(row);
      });
    }
  }

  const cl=el('button',{type:'button',className:'btn s',style:'margin-top:14px;display:block'},'Fermer');
  cl.onclick=()=>d.close();
  d.appendChild(cl);
  if(!d.open)d.showModal();
}

init();
(function(){const m=location.hash.match(/^#reset=([0-9a-f]{64})$/);if(m){window.__reset=m[1];history.replaceState(null,'',location.pathname+location.search);openAccount()}})();
</script></body></html>
