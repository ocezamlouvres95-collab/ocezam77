<!DOCTYPE html>

<style>
:root{--n:#1c2329;--or:#d97706;--ok:#15803d;--ko:#b91c1c;--bd:#d8dee4}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',Arial,sans-serif;background:#eef1f4;color:#14283a;font-size:15px}
header{background:var(--n);color:#fff;padding:8px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20}

main{padding:12px;max-width:1400px;margin:0 auto}
.btn{border:0;border-radius:8px;padding:8px 12px;font-weight:700;background:var(--n);color:#fff;cursor:pointer;font-size:14px}.btn.or{background:var(--or);color:#14283a}.btn.g{background:var(--ok)}.btn.r{background:#fbe4e4;color:var(--ko)}.btn.s{background:#e2e8ee;color:#14283a}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:#fff;max-width:100%}textarea{width:100%;min-height:55vh;font:13px monospace}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}.chip{border:1px solid var(--n);background:#fff;border-radius:99px;padding:5px 12px;font-weight:600;cursor:pointer}.chip.on{background:var(--n);color:#fff}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.ord{background:#fff;border-radius:12px;padding:12px;border-left:7px solid var(--c,#999);box-shadow:0 1px 3px #0001}.ord.dim{opacity:.6}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.num{font:800 34px/1 system-ui;min-width:52px}
.tag{border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;color:#fff;background:var(--c,#777)}.tag.p{background:#dcfce7;color:#14532d}.tag.u{background:#ffedd5;color:#9a3412}

.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px #0001;margin-bottom:12px}label.f{display:block;font-weight:600;font-size:13px;margin:10px 0 3px}

.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}.kpi{background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 1px 3px #0001}.kpi b{display:block;font-size:22px}.kpi small{color:#5d6b77}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}th{font-size:12px;color:#5d6b77}td.n,th.n{text-align:right}
.A{background:#dcfce7;color:#14532d}.B{background:#fff1d6;color:#7a4300}.C{background:#e5e7eb;color:#374151}.cl{border-radius:99px;padding:1px 9px;font-weight:700;font-size:12px}
.bars .r{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:13px}.bars .l{width:70px;flex:none;color:#5d6b77}.bars .b{height:16px;background:var(--or);border-radius:3px;min-width:2px}

.thumb{width:48px;height:48px;border-radius:8px;background:#dfe6ec center/contain no-repeat;display:flex;align-items:center;justify-content:center;font-weight:700;color:#8aa0b0;font-size:11px;text-align:center}
.gp{border:1px solid var(--bd);border-radius:10px;padding:8px;margin:8px 0;background:#f8fafb}.row2{display:flex;gap:8px;flex-wrap:wrap}.row2>div{flex:1;min-width:110px}.row2 input,.row2 select{width:100%}
dialog{border:0;border-radius:14px;width:96%;max-width:760px;max-height:94vh;padding:16px}dialog::backdrop{background:#0008}dialog textarea{min-height:80px}
.sb{position:fixed;left:0;right:0;bottom:0;background:#fff3cd;border-top:2px solid var(--or);padding:10px 14px;gap:10px;align-items:center;z-index:30}
#toast{position:fixed;top:60px;right:12px;background:#14283a;color:#fff;border-radius:8px;padding:10px 14px;z-index:99;display:none}#toast.bad{background:var(--ko)}

</style></head><body>
<div id="login"><h2 style="margin-top:0">Administration</h2><p>Code d'accès du restaurant</p><input id="tk" type="password" placeholder="Code d'accès" style="width:100%"><p id="lerr" style="color:#b91c1c"></p><button class="btn or" id="go" type="button">Entrer</button></div>
<div id="app" style="display:none"><header><b>Ô Cezam 77</b><div id="tabs"></div><button id="open" type="button"></button><small id="st"></small><button class="btn s" id="logout" type="button">Déconnexion</button></header><main id="main"></main></div>
<div class="sb" id="sb" style="display:none"><b>Modifications non enregistrées</b><button class="btn g" id="sbs" type="button">Enregistrer la carte</button><button class="btn s" id="sbc" type="button">Annuler</button></div><div id="toast"></div><div id="pa"></div>
<script>
const $=i=>document.getElementById(i),eur=n=>((n||0)/100).toFixed(2).replace('.',',')+' €';
function h(t,p,...k){const e=document.createElement(t);if(p)for(const[a,v]of Object.entries(p)){if(a==='style')Object.assign(e.style,v);else if(a in e||a.startsWith('on'))e[a]=v;else e.setAttribute(a,v)}k.flat(9).forEach(c=>{if(c==null||c===false)return;e.append(c instanceof Node?c:document.createTextNode(String(c)))});return e}
let TK=sessionStorage.getItem('tk')||'',S,TAB='orders',ordTimer,CAT=null,CD=false,SUB='items',CF='';
async function api(path,method='GET',body){const r=await fetch('/api/admin/'+path,{method,headers:{'x-admin-token':TK,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
 if(r.status===401||r.status===429){const j=await r.json().catch(()=>({}));if(r.status===401)logout();throw new Error(j.error||'Accès refusé')}return r.json()}
function toast(m,bad){const t=$('toast');t.textContent=m;t.className=bad?'bad':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',bad?5000:2200)}
function logout(){clearInterval(ordTimer);sessionStorage.removeItem('tk');TK='';S=null;CAT=null;CD=false;$('sb').style.display='none';$('main').textContent='';$('tk').value='';$('lerr').textContent='';$('app').style.display='none';$('login').style.display='block'}
$('logout').onclick=logout;
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();[880,1175].forEach((f,i)=>{const o=c.createOscillator();o.connect(c.destination);o.frequency.value=f;o.start(c.currentTime+i*.25);o.stop(c.currentTime+i*.25+.2)});setTimeout(()=>c.close(),800)}catch{}}
const pad=n=>String(n).padStart(2,'0'),fmtT=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())},fmtDT=ts=>{const d=new Date(ts);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+fmtT(ts)};
const TABS=[['orders','Commandes'],['settings','Réglages'],['menu','Carte'],['promos','Promotions'],['stats','Statistiques'],['recipes','Recettes']];
function tabs(){const t=$('tabs');t.textContent='';TABS.forEach(([k,l])=>t.append(h('button',{className:k===TAB?'on':'',type:'button',onclick:()=>{if(TAB==='menu'&&CD){if(!confirm('Quitter sans enregistrer la carte ?'))return;CAT=null;CD=false;$('sb').style.display='none'}TAB=k;tabs();show()}},l)))}
function show(){clearInterval(ordTimer);$('main').textContent='';({orders:viewOrders,settings:viewSettings,menu:viewCarte,promos:viewPromos,stats:viewStats,recipes:viewJson.bind(0,'recipes','recipes')})[TAB]()}
async function ensureCatalog(){if(CAT)return CAT;try{CAT=(await api('catalog')).catalog}catch{}return CAT}
function applyDeliveryRules(cfg){
  if(!cfg)return;
  if(cfg.minDelivery==null||cfg.minDelivery===25)cfg.minDelivery=0;
  if(cfg.freeDeliveryFrom==null||cfg.freeDeliveryFrom===70)cfg.freeDeliveryFrom=0;
  if(cfg.lowItemThreshold==null)cfg.lowItemThreshold=5;
  if(cfg.under5Fee==null)cfg.under5Fee=0;
  if(cfg.over5Fee==null)cfg.over5Fee=0;
  if(cfg.deliveryZone==null)cfg.deliveryZone='Chaumes-en-Brie et communes environnantes';
  if(cfg.maxDeliveryKm==null)cfg.maxDeliveryKm=15;
}
async function boot(){try{S=(await api('settings')).settings;applyDeliveryRules(S)}catch(e){$('lerr').textContent=e.message;return}$('login').style.display='none';$('app').style.display='block';await ensureCatalog();openBtn();tabs();show()}
$('go').onclick=()=>{TK=$('tk').value;sessionStorage.setItem('tk',TK);boot()};$('tk').onkeydown=e=>{if(e.key==='Enter')$('go').click()};
function openBtn(){const b=$('open'),st=hoursNow();b.className=st[2]?'o':'c';b.title='Fermeture exceptionnelle (prioritaire sur les horaires)';b.textContent=!S.open?'● Fermé (manuel)':st[2]?'● Commandes ouvertes':'● Fermé (hors horaires)';b.onclick=async()=>{S.open=!S.open;await saveSettings(true);openBtn()}}
async function saveSettings(q){applyDeliveryRules(S);const j=await api('settings','PUT',{settings:S});if(j.ok){S=j.settings;applyDeliveryRules(S);if(!q)toast('Réglages enregistrés')}else toast(j.error||'Erreur',true)}

/* ---- règles livraison : min 25€, frais menus offerts dès 70€ (modifiable), boisson hors menu ou suppl. boisson/canette toujours 1,80€ quel que soit le total, Louvres + 4 km ---- */
const PAY={CARTE:'Carte en ligne',ESPECES:'Espèces',CB:'CB',TICKET_RESTO:'Ticket resto',AUTRE:'Autre'};
const normTxt=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
const DRINK_RX=/\bboisson(s)?\b|\bcanette(s)?\b|\bsoda(s)?\b|\beau(x)?\b|\bjus\b|\bcoca\b|\bfanta\b|\boasis\b|\bice tea\b|\bsprite\b|\b7up\b|\bperrier\b|\bevioan\b|\bcristaline\b/;

function getCatNameForItem(l){
  if(!CAT||!Array.isArray(CAT.items)||!Array.isArray(CAT.cats))return '';
  const lbl=normTxt(l.label||l.name||l.n);
  const found=CAT.items.find(x=>(l.id&&x.id===l.id)||(l.itemId&&x.id===l.itemId)||(lbl&&normTxt(x.n)===lbl));
  if(!found)return '';
  const cat=CAT.cats.find(c=>c.id===found.c);
  return normTxt(cat?.n||'');
}

function isMenuLine(l){
  const txt=normTxt(l.label||l.name||l.n);
  const cat=getCatNameForItem(l);
  return /\bmenu(s)?\b/.test(txt)||/\bmenu(s)?\b/.test(cat);
}

function countBillableDrinksInLine(l){
  const qty=Number(l.qty)||1;
  const txt=normTxt(l.label||l.name||l.n);
  const cat=getCatNameForItem(l);
  const lineIsMenu=isMenuLine(l);

  let count=0;
  // Boisson hors menu uniquement (celle comprise dans un menu reste incluse)
  if(!lineIsMenu&&(DRINK_RX.test(txt)||/\bboisson(s)?\b/.test(cat))){
    count+=qty;
  }

  // Supplément boisson ou canette en plus
  const supOpts=[...(l.detail||[]),...(l.extras||[]),...(l.supplements||[])];
  supOpts.forEach(opt=>{
    const s=normTxt(typeof opt==='object'?(opt.n||opt.name||opt.label||opt.t||''):opt);
    const isSupDrink=/\bsupplement\b|\ben plus\b|\bextra\b|\bcanette(s)?\b|\bboisson(s)?\b/.test(s)&&DRINK_RX.test(s);
    if(isSupDrink){
      count+=qty;
    }
  });

  return count;
}

function getOrderSubTotalCents(o){
  let calcItemsCents=0;
  (o.lines||[]).forEach(l=>{
    const pr=getLinePricing(l);
    if(pr.baseTotalCents!=null)calcItemsCents+=pr.baseTotalCents+pr.supTotalCents;
  });
  const discCents=o.discount||0;
  if(calcItemsCents>0)return Math.max(0,calcItemsCents-discCents);
  return Math.max(0,(o.total||0)-(o.fee||0));
}

function computeDeliveryBreakdown(o,subCentsOverride=null){
  const cfg=S||{};
  const lowThreshCents=Math.round((parseFloat(cfg.lowItemThreshold??5)||5)*100);
  const underFeeCents=Math.round((parseFloat(cfg.under5Fee??0.5)||0.5)*100);
  const overFeeCents=Math.round((parseFloat(cfg.over5Fee??1)||1)*100);
  const freeFromEuros=parseFloat(cfg.freeDeliveryFrom??80)||0;
  const freeFromCents=freeFromEuros>0?Math.round(freeFromEuros*100):0;

  let underCount=0,overCount=0,rawFeeCents=0;
  (o.lines||[]).forEach(l=>{
    const q=Math.max(1,Number(l.qty)||1);
    const pr=getLinePricing(l);
    const baseUnitCents=pr.baseTotalCents!=null?Math.round(pr.baseTotalCents/q):0;
    if(baseUnitCents<lowThreshCents){underCount+=q;rawFeeCents+=underFeeCents*q}
    else{overCount+=q;rawFeeCents+=overFeeCents*q}
  });

  const subCents=subCentsOverride!=null?subCentsOverride:getOrderSubTotalCents(o);
  const isFree=o.mode==='LIVRAISON'&&freeFromCents>0&&subCents>=freeFromCents;
  const feeCents=o.mode==='LIVRAISON'?(isFree?0:rawFeeCents):0;
  return{underCount,overCount,underFeeCents,overFeeCents,rawFeeCents,feeCents,isFree,freeFromCents};
}

function parseEurToCents(v,forceEuros=false){
  if(v==null||v==='')return null;
  if(typeof v==='number'&&!isNaN(v)){
    if(forceEuros)return Math.round(v*100);
    return Number.isInteger(v)&&Math.abs(v)>=100?v:Math.round(v*100);
  }
  const m=String(v).replace(',','.').match(/(-?\d+(?:\.\d{1,2})?)/);
  if(!m)return null;
  const num=parseFloat(m[1]);
  return isNaN(num)?null:Math.round(num*100);
}

function catalogItemCents(l){
  if(!CAT||!Array.isArray(CAT.items))return null;
  const lbl=normTxt(l.label||l.name||l.n);
  const found=CAT.items.find(x=>(l.id&&x.id===l.id)||(l.itemId&&x.id===l.itemId)||(lbl&&normTxt(x.n)===lbl));
  if(!found||found.p==null)return null;
  return parseEurToCents(found.p,true);
}

function catalogOptionCents(optName){
  if(!CAT||!optName)return null;
  const cleanName=normTxt(String(optName).replace(/\(.*?\)/g,'').replace(/^[•·+-]\s*/,''));
  if(!cleanName)return null;
  const allChoices=[];
  if(CAT.lists)Object.values(CAT.lists).forEach(lst=>{if(Array.isArray(lst.ch))allChoices.push(...lst.ch)});
  if(Array.isArray(CAT.items))CAT.items.forEach(it=>{if(Array.isArray(it.groups))it.groups.forEach(g=>{if(Array.isArray(g.ch))allChoices.push(...g.ch)})});
  const match=allChoices.find(c=>c&&c.n&&normTxt(c.n)===cleanName);
  if(!match||match.p==null)return null;
  return parseEurToCents(match.p,true);
}

function extractOptionParts(d){
  if(d&&typeof d==='object'){
    const name=String(d.n||d.name||d.label||d.t||'').trim();
    const rawP=d.p??d.price??d.supp??d.extra??d.sup??null;
    let cents=parseEurToCents(rawP,typeof rawP==='number'&&rawP<50);
    if(cents==null)cents=catalogOptionCents(name);
    return{name,cents:cents||0};
  }
  const rawStr=String(d||'').trim();
  if(!rawStr)return{name:'',cents:0};
  const colonIdx=rawStr.indexOf(':');
  if(colonIdx>0){
    const prefix=rawStr.slice(0,colonIdx).trim();
    const rest=rawStr.slice(colonIdx+1).trim();
    const parts=rest.split(',').map(p=>p.trim()).filter(Boolean);
    let totalPartCents=0;
    const formattedParts=parts.map(part=>{
      const m=part.match(/\(\s*\+?(\d+(?:[.,]\d{1,2})?)\s*€?\s*\)/);
      if(m){
        const c=Math.round(parseFloat(m[1].replace(',','.'))*100)||0;
        totalPartCents+=c;
        return part.replace(/\(\s*\+?(\d+(?:[.,]\d{1,2})?)\s*€?\s*\)/,`(+${eur(c)})`);
      }
      const c=catalogOptionCents(part);
      if(c&&c>0){
        totalPartCents+=c;
        return `${part} (+${eur(c)})`;
      }
      return part;
    });
    return{name:`${prefix} : ${formattedParts.join(', ')}`,cents:totalPartCents,alreadyFormatted:true};
  }
  const m=rawStr.match(/\(\s*\+?(\d+(?:[.,]\d{1,2})?)\s*€?\s*\)/);
  if(m){
    const c=Math.round(parseFloat(m[1].replace(',','.'))*100)||0;
    const clean=rawStr.replace(/\(\s*\+?(\d+(?:[.,]\d{1,2})?)\s*€?\s*\)/,'').trim();
    return{name:clean,cents:c};
  }
  const c=catalogOptionCents(rawStr);
  return{name:rawStr,cents:c||0};
}

function getLinePricing(l){
  const qty=Number(l.qty)||1;
  const supList=[...(l.detail||[]),...(l.extras||[]),...(l.supplements||[])];
  const parsedSups=supList.map(d=>{
    const p=extractOptionParts(d);
    const label=p.alreadyFormatted?p.name:(p.cents>0?`${p.name} (+${eur(p.cents)})`:p.name);
    return{label,unitSupCents:p.cents,totalSupCents:p.cents*qty};
  }).filter(x=>x.label);

  const supTotalCents=parsedSups.reduce((s,x)=>s+x.totalSupCents,0);
  const directUnit=l.unit_price??l.unitPrice??l.pu??l.prix??l.price??l.p;
  let baseUnitCents=parseEurToCents(directUnit,typeof directUnit==='number'&&directUnit<50);
  if(baseUnitCents==null)baseUnitCents=catalogItemCents(l);

  let baseTotalCents=baseUnitCents!=null?baseUnitCents*qty:null;
  if(baseTotalCents==null){
    const lineTotRaw=l.total??l.amount??l.tot??l.subtotal??l.line_total??l.price_total;
    const lineTotCents=parseEurToCents(lineTotRaw);
    if(lineTotCents!=null)baseTotalCents=Math.max(0,lineTotCents-supTotalCents);
  }
  return{qty,baseTotalCents,supTotalCents,parsedSups};
}

function buildTicketLines(o,kind){
  const P=S.printer,L=[];
  const isClient=kind==='client';
  const isDel=o.mode==='LIVRAISON';
  const payLbl=PAY[o.pay_method]||o.pay_method||(o.pay_pref==='CARTE'?'Carte en ligne':'Sur place');
  const discCents=o.discount||0;

  L.push({t:P.header||S.name,m:1.35,a:'C'});
  L.push({t:(isClient?'TICKET CLIENT':'TICKET CUISINE')+' · N° '+(o.num??'—'),m:1.65,a:'C'});
  L.push({t:isDel?'LIVRAISON (LOUVRES / 4KM)':'A EMPORTER',m:1.3,a:'C'});
  L.push({t:'Date : '+fmtDT(o.ts),m:.95});
  L.push({t:'Heure souhaitee : '+(o.heure||'Dès que possible'),m:1.05});
  L.push({rule:1});

  L.push({t:'Client : '+(o.prenom||'Client'),m:1.1});
  L.push({t:'Tel    : '+(o.telephone||'—'),m:1.1});
  if(isDel){
    L.push({t:'ADRESSE LIVRAISON :',m:1.05});
    L.push({t:(o.adresse||'')+' '+(o.code_postal||''),m:1.05});
  }
  L.push({rule:1});

  let calcItemsCents=0;
  (o.lines||[]).forEach((l,idx)=>{
    if(idx>0)L.push({t:'--------------------------------',m:.85,br:1});
    const pr=getLinePricing(l);
    const stored=(l.total!=null&&isFinite(+l.total)&&+l.total>=0)?Math.round(+l.total):null;
    const lineCents=stored!=null?stored:(pr.baseTotalCents!=null?pr.baseTotalCents+pr.supTotalCents:null);
    if(lineCents!=null)calcItemsCents+=lineCents;

    const menuTitle=(pr.qty+' x '+(l.label||'Article'))+(isClient&&lineCents!=null?' - '+eur(lineCents):'');
    L.push({t:menuTitle,m:1.2});

    (l.inc||[]).forEach(d=>{
      const txt=String(d||'').trim();
      if(txt)L.push({t:'  · '+txt,m:.95});
    });

    pr.parsedSups.forEach(s=>{
      if(isClient){
        L.push({t:'  + '+s.label,m:.95});
      }else{
        const cleanKitchen=s.label.replace(/\s*\(\+\d+(?:[.,]\d{1,2})?\s*€\)/g,'');
        L.push({t:'  + '+cleanKitchen,m:.95});
      }
    });

    if(l.note)L.push({t:'  * NOTE : '+l.note,m:1.05});
  });

  if(o.remarque){
    L.push({rule:1,br:1});
    L.push({t:'REMARQUES CLIENT : '+o.remarque,m:1.1});
  }

  if(isClient){
    L.push({rule:1,br:1});
    const hasNum=v=>v!=null&&isFinite(+v);
    const discCents2=hasNum(o.discount)?Math.round(+o.discount):0;
    const subCents=hasNum(o.subtotal)?Math.round(+o.subtotal):(calcItemsCents>0?calcItemsCents:Math.max(0,(o.total||0)+discCents2-(o.fee||0)));
    const netItemsCents=Math.max(0,subCents-discCents2);
    const del=computeDeliveryBreakdown(o,subCents);
    const feeCents=isDel?(hasNum(o.fee)?Math.round(+o.fee):del.feeCents):0;
    const totalCents=hasNum(o.total)?Math.round(+o.total):netItemsCents+feeCents;
    const reste=o.paid?'0,00 € (PAYÉ)':eur(totalCents)+' À PAYER';

    L.push({t:'Sous-total : '+eur(subCents),m:1});
    if(discCents2)L.push({t:'Remise'+(o.promo?' ('+o.promo+')':'')+' : -'+eur(discCents2),m:.95});
    if(isDel){
      /* détail affiché seulement s'il correspond exactement aux frais enregistrés */
      if(feeCents===del.feeCents){
        if(del.isFree){
          L.push({t:`Livraison OFFERTE (dès ${eur(del.freeFromCents)})`,m:.95});
        }else{
          if(del.underCount>0)L.push({t:`Art. < ${eur(Math.round((S.lowItemThreshold??5)*100))} (${del.underCount} x ${eur(del.underFeeCents)}) : ${eur(del.underCount*del.underFeeCents)}`,m:.95});
          if(del.overCount>0)L.push({t:`Art. >= ${eur(Math.round((S.lowItemThreshold??5)*100))} (${del.overCount} x ${eur(del.overFeeCents)}) : ${eur(del.overCount*del.overFeeCents)}`,m:.95});
        }

/* ---- Adaptation automatique taille police & découpage multi-tickets si commande très longue ---- */
const wrap=(t,n)=>{const out=[];let cur='';for(const w of String(t).split(/(\s+)/)){if((cur+w).length>n&&cur.trim()){out.push(cur.trimEnd());cur=w.trimStart()}else cur+=w;while(cur.length>n){out.push(cur.slice(0,n));cur=cur.slice(n)}}if(cur.trim())out.push(cur.trimEnd());return out.length?out:['']};

const zs=t=>String(t==null?'':t).replace(/[\u2012-\u2015]/g,'-').replace(/\u00b7/g,'-').replace(/[\u2018\u2019]/g,"'").replace(/[\u201c\u201d]/g,'"').replace(/\u00a0/g,' ');
function measureTicketLines(lines,W,baseFont,scale=1){
  const gap=scale<0.85?1.12:1.2;
  let y=10;
  for(const l of lines){
    if(l.rule){y+=scale<0.85?12:16;continue}
    const sz=Math.max(15,Math.round(baseFont*(l.m||1)*scale));
    const cpl=Math.max(8,Math.floor(W/(sz*.62)));
    y+=wrap(zs(l.t),cpl).length*Math.round(sz*gap);
  }
  return y+70;
}

function renderZplChunk(lines,W,baseFont,scale,copies){
  const gap=scale<0.85?1.12:1.2;
  let y=10;
  const out=[];
  for(const l of lines){
    if(l.rule){
      out.push(`^FO0,${y+4}^GB${W},2,2^FS`);
      y+=scale<0.85?12:16;
      continue;
    }
    const sz=Math.max(15,Math.round(baseFont*(l.m||1)*scale));
    const cpl=Math.max(8,Math.floor(W/(sz*.62)));
    for(const t of wrap(zs(l.t),cpl)){
      out.push(`^FO0,${y}^FB${W},1,0,${l.a||'L'},0^A0N,${sz}^FD${t.replace(/[\^~\\]/g,' ')}^FS`);
      y+=Math.round(sz*gap);
    }
  }
  return `^XA\n^CI28\n^PW${W}\n^LL${y+70}\n^LH0,0\n${out.join('\n')}\n^PQ${copies||1}\n^XZ`;
}

function zplSingle(o,kind){
  const P=S.printer,W=P.width,baseFont=P.font||24;
  const allLines=buildTicketLines(o,kind);
  const SOFT_MAX=1250;
  const HARD_MAX=2300;

  let scale=1;
  for(const s of [1,0.92,0.85,0.78,0.72]){
    scale=s;
    if(measureTicketLines(allLines,W,baseFont,s)<=SOFT_MAX)break;
  }

  if(measureTicketLines(allLines,W,baseFont,scale)<=HARD_MAX){
    return renderZplChunk(allLines,W,baseFont,scale,P.copies||1);
  }

  const chunks=[];
  let cur=[];
  for(const l of allLines){
    if(l.br&&cur.length>4&&measureTicketLines([...cur,l],W,baseFont,scale)>HARD_MAX*0.62){
      chunks.push(cur);
      cur=[];
    }
    cur.push(l);
  }
  if(cur.length)chunks.push(cur);

  if(chunks.length<=1){
    return renderZplChunk(allLines,W,baseFont,scale,P.copies||1);
  }

  const labelType=kind==='client'?'TICKET CLIENT':'TICKET CUISINE';
  return chunks.map((ch,idx)=>{
    const hdr=[
      {t:P.header||S.name,m:1.25,a:'C'},
      {t:`${labelType} (${idx+1}/${chunks.length}) · N° ${o.num??'—'}`,m:1.45,a:'C'},
      {rule:1}
    ];
    const body=idx===0?ch:[...hdr,...ch];
    return renderZplChunk(body,W,baseFont,scale,P.copies||1);
  }).join('\n');
}

const nz=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();
function matchFile(base){const b=nz(base),bt=new Set(b.split(' ').filter(t=>t.length>1));
 const byId=CAT.items.filter(i=>nz(i.id)===b);if(byId.length)return byId.map(i=>i.id);
 const byName=CAT.items.filter(i=>nz(i.n)===b);if(byName.length)return byName.map(i=>i.id);
 if(!bt.size)return[];const sc=[];
 for(const i of CAT.items){const it=new Set(nz(i.n).split(' ').filter(t=>t.length>1));let c=0;bt.forEach(t=>{if(it.has(t))c++});if(c===bt.size)sc.push([i.id,c/it.size])}
 return sc.sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0])}
async function unzip(file){const buf=await file.arrayBuffer(),dv=new DataView(buf),u8=new Uint8Array(buf);let e=u8.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('ZIP illisible : '+file.name);
 const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out=[];
 for(let i=0;i<n;i++){if(dv.getUint32(p,true)!==0x02014b50)break;const m=dv.getUint16(p+10,true),cs=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true),name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
  if(name.endsWith('/')||name.includes('__MACOSX')||!/\.(jpe?g|png|webp)$/i.test(name))continue;
  const lnl=dv.getUint16(off+26,true),lxl=dv.getUint16(off+28,true),ds=off+30+lnl+lxl,raw=u8.subarray(ds,ds+cs);let data=raw;
  if(m===8)data=await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();else if(m!==0)continue;
  const ext=name.split('.').pop().toLowerCase();out.push(new File([data],name.split('/').pop(),{type:ext==='png'?'image/png':ext==='webp'?'image/webp':'image/jpeg'}))}
 return out}
function bulkPhotos(){dlg('Importer des photos en lot',(d,close)=>{

  sorted=CAT.items.slice().sort((a,b)=>(a.n>b.n?1:-1)),catN=Object.fromEntries(CAT.cats.map(c=>[c.id,c.n]));
 const ids=r=>r.sel==='auto'?r.auto:r.sel==='none'?[]:[r.sel],total=()=>rows.reduce((s,r)=>s+ids(r).length,0);

   t.append(h('tr',0,h('td',0,h('div',{className:'thumb',style:{backgroundImage:`url(${r.url})`}})),h('td',0,r.file.name),h('td',0,sel)))});

  let k=0;await Promise.all([0,1,2].map(async()=>{while(k<jobs.length)await one(jobs[k++])}));
